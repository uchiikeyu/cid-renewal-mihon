<!doctype html>
<html lang="ja" data-fx="spectrum">
<head>
<meta charset="utf-8">
<script>window.CID_ROOT = '../';</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>資料請求・お問い合わせ｜CID 中央情報大学校（作り直し見本・カラー版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css?v=20261112b">
<link rel="stylesheet" href="../css/pages.css?v=20261112b">
<link rel="stylesheet" href="color.css?v=20261112b">
</head>
<body class="is-color" data-page="contact">
<main>
<section class="page-hero page-hero--text">
  <div class="wrap"><div>
    <p class="crumb"><a href="index.html">トップ</a>　／　資料請求・お問い合わせ</p>
    <h1>資料請求・お問い合わせ</h1>
    <p class="lead">パンフレットの請求や、入学・学校生活についての質問はこちらから。電話 027-324-8511（9:00〜17:00、土日祝を除く）でも受け付けています。</p>
  </div></div>
</section>
<section class="sec sec--light" style="margin-top:48px">
  <div class="wrap">
<form class="form" id="f" novalidate>
<label>ご用件<span class="req">必須</span><select required><option value="">選んでください</option><option>資料請求</option><option>お問い合わせ</option></select></label>
<label>お名前<span class="req">必須</span><input required autocomplete="name"></label>
<label>フリガナ<span class="req">必須</span><input required></label>
<label>メールアドレス<span class="req">必須</span><input type="email" required autocomplete="email"></label>
<label>現在の状況<span class="req">必須</span><select required><option value="">選んでください</option><option>高校3年生</option><option>高校2年生</option><option>高校1年生</option><option>短大生</option><option>専門学生</option><option>大学生</option><option>社会人</option><option>留学生</option><option>その他</option></select></label>
<label>学校名／最終学歴<span class="req">必須</span><input required></label>
<label>郵便番号<span class="req">必須</span><input required autocomplete="postal-code" inputmode="numeric"></label>
<label>住所<span class="req">必須</span><input required autocomplete="street-address"></label>
<label>ご質問など<textarea></textarea></label>
<button class="btn-oc" type="submit">送信する</button><p class="msg" id="msg" aria-live="polite"></p></form>
<p class="note-block">いただいた情報は、資料の配送と入学関連の連絡にのみ使います。見本のため、このフォームは送信されません。</p>
<script>
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const miss = [...e.target.querySelectorAll('[required]')].filter(x => !x.value.trim()), m = document.getElementById('msg');
  if (miss.length) { m.style.color = 'var(--signal)'; m.textContent = '必須の項目が' + miss.length + 'つ空いています：' + miss.map(x => x.closest('label').firstChild.textContent.trim()).join('、'); miss[0].focus(); return; }
  m.style.color = 'var(--ink)'; m.textContent = '見本のため送信していません。本番では、ここで送信が完了します。';
});
</script>
  </div>
</section>
</main>
<script src="../js/layout.js?v=20261112b"></script>
<script src="color.js?v=20261112b"></script>
</body>
</html>
